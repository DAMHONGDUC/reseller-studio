name: reseller_studio
description: "Reseller Studio — the operating system for resellers: source, list, sell, ship, profit."
publish_to: 'none'
version: 1.0.0+29

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.6
  cupertino_icons: ^1.0.8
  # The guest store. Records written before anyone signs in live here and
  # nowhere else, until sign-in drains them — see docs/rules/GUEST_MODE.md.
  # drift_flutter carries the native sqlite3 and the app-private path.
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.1
  firebase_storage: ^13.2.6
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The design system reads dimensions through screenutil, so the app must
  # install ScreenUtilInit above MaterialApp or every SdSpacingConstant getter
  # throws. See lib/reseller_studio_app.dart.
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  hooks_riverpod: ^3.3.2
  image_picker: ^1.2.0
  intl: 0.20.2
  logger: ^2.5.0
  material_symbols_icons: ^4.2960.0
  mobile_scanner: ^7.1.4
  # Where a guest's photos are copied to. image_picker hands back a temporary
  # path the OS may delete, so the file has to be moved somewhere app-private
  # before the record points at it (docs/rules/GUEST_MODE.md).
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  purchases_flutter: ^10.9.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  # The shared design system. Its own git repo, checked out here as a
  # submodule — tokens, theme and string-free widgets live there, not in
  # lib/core. Reseller Studio renders on its v3 generation and never touches v2.
  simple_icons: ^16.23.0
  system_design:
    path: packages/system_design
  # Flutter team's own plugin, and the only way to open the policy pages the
  # App Store requires a link to. No service behind it — it hands the URL to
  # the OS.
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  # The repo's only codegen, and its output is committed so `melos run
  # analyze` still needs no build step (docs/rules/GUEST_MODE.md).
  build_runner: ^2.10.0
  drift_dev: ^2.28.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # The task runner. Melos 6 on purpose — see melos.yaml for why.
  # Pinned exactly: the global install and this one must be the same version,
  # or melos launches one version's code against the other's asset templates
  # and bootstrap dies on a missing .tmpl file.
  melos: 6.3.3

flutter:
  generate: true
  uses-material-design: true

  # Vendor brand marks for the two sign-in buttons, shipped as the vendors
  # publish them. Apple and Google each forbid a redrawn substitute, so these
  # files are copied in, never authored here. See RELEASE_ACTIONS.md.
  assets:
    - assets/brand/

  # Inter, bundled rather than fetched at runtime.
  #
  # `google_fonts` would download on first launch, which means a seller in a
  # stockroom with no signal opens the app to a fallback face — and this app
  # is mostly columns of money, where the typeface is doing real work.
  #
  # Two families on purpose. `Inter` is the text face used everywhere; `Inter
  # Display` is optically tuned for large sizes (tighter apertures, less
  # spacing) and is used only by the headline styles. Using the text face at
  # 28sp looks loose; using the display face at 12sp looks cramped.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Inter Display
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
