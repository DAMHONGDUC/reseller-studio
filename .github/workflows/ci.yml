name: CI

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same branch cancels the first: the only run whose
# result matters is the one for the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The design kit and script-tools are submodules, and every step below
      # needs one or the other, so a checkout without them fails on the first
      # command rather than the last.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # **CI follows the submodules' `main`, not the pinned gitlinks.**
      # Owner's call: the submodule is developed alongside the app, and having
      # to bump the gitlink here for every widget change is a second commit
      # nobody remembers. `--remote` takes the branch named in `.gitmodules`,
      # which is already `main` for both.
      #
      # The trade this makes, and it is a real one: a green run proves the app
      # builds against the *tip* of each submodule, not against the commit
      # this repo has recorded. A local checkout still uses the gitlink, so the
      # two can disagree — if CI passes and a laptop does not, that gap is the
      # first thing to check.
      - name: Track the submodules' main
        run: git submodule update --remote --recursive

      - name: Submodules checked out
        run: test -f packages/flutter-system-design-kit/pubspec.yaml && test -f packages/script-tools/flutter/lib/common.sh

      # Read from `.fvmrc` rather than pinned here. The version is a number,
      # and a number belongs in one place — repeating it in this file is how a
      # CI job ends up testing a different SDK from the one people develop on.
      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      # Every package the analyzer walks: the app, the design kit on its own,
      # and script-tools' icon tools, which fail analysis unresolved.
      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/flutter-system-design-kit && flutter pub get)
          (cd packages/script-tools/flutter/dart && dart pub get)

      # `lib/l10n/gen/` is gitignored, so nothing compiles until it is built.
      - name: Localizations
        run: flutter gen-l10n

      # The scripts, not their contents retyped here. `make analyze` is
      # "exactly what CI runs" and this is what makes that true.
      - name: Analyze
        run: bash packages/script-tools/flutter/analyze_code.sh

      - name: Test
        run: bash packages/script-tools/flutter/run_tests.sh

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No submodule and no Flutter — `functions/` is a standalone TypeScript
    # package, and coupling it to the app's job would make a Dart failure hide
    # a broken function.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The runtime Cloud Functions runs, from `functions/package.json`.
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dependencies
        working-directory: functions
        run: npm ci

      - name: Lint
        working-directory: functions
        run: npm run lint

      # A real build rather than `tsc --noEmit`. It still proves the source
      # compiles, and the test suite below imports the compiled output —
      # `functions/test/*.test.mjs` runs under plain node, which cannot read
      # TypeScript. The deploy builds its own output either way.
      - name: Build
        working-directory: functions
        run: npm run build
