# Melos 6 on purpose, not 7/8.
#
# Melos 7+ moves to Dart pub workspaces, which requires `resolution: workspace`
# inside packages/system_design — and that stops the package resolving in any
# project that is not itself a workspace. BaroEase consumes the same submodule
# and is not a workspace, so adopting it here would break the other app.
# That portability is the whole reason the design system is a submodule.
#
# Every melos since 3.0.0 needs `melos` in the root dev_dependencies, so that
# part is unavoidable either way.
name: reseller_studio

packages:
  - .
  - packages/**

# melos 6.3.3 ships without the IntelliJ run-configuration templates it tries
# to write, so bootstrap crashes on `flutter_run_with_args.xml.tmpl`. Nothing
# here uses those files — this project runs from VS Code launch configs.
ide:
  intellij: false

# **A flavour is a separate command, never a flag on a shared one.** `-dev` and
# `-prod` are typed on purpose: a prod deploy inherited from whatever the CLI
# was last pointed at is the failure this prevents. One script serves both and
# takes the flavour as $1 — these entries are the only thing duplicated.
#
# **Underscore-prefixed files in tool/ are not commands.** `_common.sh`,
# `_clean.sh`, `_url-scheme.sh` are sourced or called by others and are never
# named here.
#
# Each script is one line on purpose. Melos echoes the whole `run:` body
# before AND after every run, with no flag to turn it off, so a multi-line
# block buries the output it is meant to introduce. The bodies live in
# `tool/*.sh`, which also makes them lintable and runnable under dash — the
# shell melos actually uses on Linux, and the one macOS hides from you.
scripts:
  set-up:
    description: Wipe, then everything a fresh clone needs. Idempotent.
    run: sh tool/set-up.sh

  deep-set-up:
    description: set-up, plus Xcode's derived data. Costs a cold build.
    run: sh tool/deep-set-up.sh

  prepare-env-dev:
    description: Install dev's config — env files and the native files.
    run: sh tool/prepare-env.sh dev

  prepare-env-prod:
    description: Install prod's config — env files and the native files.
    run: sh tool/prepare-env.sh prod

  run:
    description: Run the app. `melos run run -- prod` for release config.
    run: sh tool/run.sh

  gen:
    description: Localizations and codegen, nothing else.
    run: sh tool/gen.sh

  analyze:
    description: Zero findings, or fail. Exactly what CI runs.
    run: sh tool/analyze.sh

  test:
    description: The test suite. For CI and full sweeps, not per-change.
    run: sh tool/test.sh

  test-rules:
    description: firestore.rules against the emulator. Needs Java.
    run: sh tool/test-rules.sh

  preflight:
    description: Everything that must be true before a build is worth uploading.
    run: sh tool/preflight.sh

  build-ipa-dev:
    description: The IPA, dev config attached. The only place an archive is made.
    run: sh tool/build-ipa.sh dev

  build-ipa-prod:
    description: The IPA, prod config attached. The only place an archive is made.
    run: sh tool/build-ipa.sh prod

  deploy-firebase-dev:
    description: Rules, indexes and functions to the dev alias. Confirms first.
    run: sh tool/deploy-firebase.sh dev

  deploy-firebase-prod:
    description: Rules, indexes and functions to the prod alias. Confirms first.
    run: sh tool/deploy-firebase.sh prod

sdkPath: .fvm/flutter_sdk
